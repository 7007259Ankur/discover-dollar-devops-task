services:
  mongo:
    image: mongo:6
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db

  backend:
    build: ./backend
    image: 7007259ankur/crud-backend:latest
    restart: unless-stopped
    depends_on:
      - mongo
    environment:
      MONGO_URL: "mongodb://mongo:27017/mydb"
    expose:
      - "3000"

  frontend:
    build: ./frontend
    image: 7007259ankur/crud-frontend:latest
    restart: unless-stopped
    depends_on:
      - backend
    expose:
      - "80"

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - frontend
      - backend
    volumes:
      - /c/Users/ankur/Downloads/crud-dd-task-mean-app/crud-dd-task-mean-app/nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  mongo-data:
