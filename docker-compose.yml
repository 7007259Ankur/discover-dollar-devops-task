version: '3.8'

services:
  mongo:
    image: mongo:6
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db

  backend:
    # REMOVED "build: ./backend" because code does not exist on server
    # CHANGED to use variable to match GitHub Secret exactly
    image: ${DOCKER_USERNAME}/crud-backend:latest
    restart: unless-stopped
    depends_on:
      - mongo
    environment:
      MONGO_URL: "mongodb://mongo:27017/mydb"
    expose:
      - "3000"

  frontend:
    # REMOVED "build: ./frontend"
    # CHANGED to use variable
    image: ${DOCKER_USERNAME}/crud-frontend:latest
    restart: unless-stopped
    depends_on:
      - backend
    expose:
      - "80"

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - frontend
      - backend
    volumes:
      # CRITICAL FIX: Changed Windows path to relative path for Linux
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  mongo-data: