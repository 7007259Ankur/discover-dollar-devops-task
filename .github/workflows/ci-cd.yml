name: build-and-deploy

on:
  push:
    branches: ["main"]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    # --------------------------
    # CHECKOUT CODE
    # --------------------------
    - name: Checkout code
      uses: actions/checkout@v3

    # --------------------------
    # LOGIN TO DOCKER HUB (On GitHub Runner)
    # --------------------------
    - name: Login to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_PASSWORD }}

    # --------------------------
    # BUILD BACKEND IMAGE
    # --------------------------
    - name: Build backend image
      run: |
        docker build -t "${{ secrets.DOCKERHUB_USERNAME }}/crud-backend:latest" ./backend

    - name: Push backend image
      run: |
        docker push "${{ secrets.DOCKERHUB_USERNAME }}/crud-backend:latest"

    # --------------------------
    # BUILD FRONTEND IMAGE
    # --------------------------
    - name: Build frontend image
      run: |
        docker build -t "${{ secrets.DOCKERHUB_USERNAME }}/crud-frontend:latest" ./frontend

    - name: Push frontend image
      run: |
        docker push "${{ secrets.DOCKERHUB_USERNAME }}/crud-frontend:latest"

    # --------------------------
    # COPY CONFIG FILES TO EC2
    # --------------------------
    - name: Copy docker-compose + nginx.conf to EC2
      uses: appleboy/scp-action@v0.1.4
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ubuntu
        key: ${{ secrets.EC2_SSH_KEY }}
        source: "docker-compose.yml,nginx.conf"
        target: "/home/ubuntu/app"

    # --------------------------
    # SSH & DEPLOY (Updated with Login)
    # --------------------------
    - name: SSH into EC2 & restart services
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ubuntu
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          # 1. Login to Docker Hub on the EC2 Server so we can pull private images
          echo "${{ secrets.DOCKERHUB_PASSWORD }}" | sudo docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

          # 2. Go to app folder
          cd /home/ubuntu/app

          # 3. Pull latest images (this will now work because we are logged in)
          sudo docker-compose pull

          # 4. Restart containers
          sudo docker-compose down
          sudo docker-compose up -d