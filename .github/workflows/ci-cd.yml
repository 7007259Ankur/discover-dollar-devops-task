name: build-and-deploy

on:
  push:
    branches: ["main"]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    # --------------------------
    # 1. CHECKOUT
    # --------------------------
    - name: Checkout code
      uses: actions/checkout@v3

    # --------------------------
    # 2. LOGIN TO DOCKER HUB
    # --------------------------
    - name: Login to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_PASSWORD }}

    # --------------------------
    # 3. BUILD & PUSH BACKEND
    # --------------------------
    - name: Build backend image
      run: |
        docker build -t "${{ secrets.DOCKERHUB_USERNAME }}/crud-backend:latest" ./backend

    - name: Push backend image
      run: |
        docker push "${{ secrets.DOCKERHUB_USERNAME }}/crud-backend:latest"

    # --------------------------
    # 4. BUILD & PUSH FRONTEND
    # --------------------------
    - name: Build frontend image
      run: |
        docker build -t "${{ secrets.DOCKERHUB_USERNAME }}/crud-frontend:latest" ./frontend

    - name: Push frontend image
      run: |
        docker push "${{ secrets.DOCKERHUB_USERNAME }}/crud-frontend:latest"

    # --------------------------
    # 5. COPY CONFIG FILES
    # --------------------------
    - name: Copy docker-compose + nginx.conf to EC2
      uses: appleboy/scp-action@v0.1.4
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ubuntu
        key: ${{ secrets.EC2_SSH_KEY }}
        source: "docker-compose.yml,nginx.conf"
        target: "/home/ubuntu/app"

    # --------------------------
    # 6. SSH & DEPLOY
    # --------------------------
    - name: SSH into EC2 & restart services
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ubuntu
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          # Login to Docker Hub
          echo "${{ secrets.DOCKERHUB_PASSWORD }}" | sudo docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

          cd /home/ubuntu/app

          # Create .env file so docker-compose knows the username
          echo "DOCKER_USERNAME=${{ secrets.DOCKERHUB_USERNAME }}" > .env

          # Pull and restart
          sudo docker-compose pull
          sudo docker-compose down
          sudo docker-compose up -d